<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" overflow="visible">
  <defs>
    <style>
      .tsl-threat { color: #8E44AD; }
    </style>
  </defs>
  <g class="tsl-threat">
    
    <g opacity="0.2" fill="none" stroke="currentColor" stroke-width="4"><circle cx="30" cy="50" r="12"/><circle cx="50" cy="50" r="12"/><circle cx="70" cy="50" r="12"/></g>
    
    <g stroke-dasharray="6 4">
      <rect x="5" y="5" width="90" height="90" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/>
    </g>
    
    
    <g class="tsl-modifier">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><line x1="85" y1="15" x2="110" y2="-10"/><line x1="15" y1="85" x2="-10" y2="110"/></g>
    </g>
  </g>
</svg>