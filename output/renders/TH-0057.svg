<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" overflow="visible">
  <defs>
    <style>
      .tsl-threat { color: #E74C3C; }
    </style>
  </defs>
  <g class="tsl-threat">
    
    <g opacity="0.2" fill="currentColor"><rect x="20" y="60" width="15" height="20"/><rect x="42" y="40" width="15" height="40"/><rect x="65" y="20" width="15" height="60"/></g>
    
    <g stroke-dasharray="6 4">
      <polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/>
