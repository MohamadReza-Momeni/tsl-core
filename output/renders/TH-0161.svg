<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" overflow="visible">
  <defs>
    <style>
      .tsl-threat { color: #8E44AD; }
    </style>
  </defs>
  <g class="tsl-threat">
    
    <g opacity="0.2" fill="currentColor"><rect x="20" y="60" width="15" height="20"/><rect x="42" y="40" width="15" height="40"/><rect x="65" y="20" width="15" height="60"/></g>
    
    <g stroke-dasharray="6 2 2 2">
      <rect x="5" y="5" width="90" height="90" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/>
    </g>
    
    
    <g class="tsl-modifier">
      <rect x="0" y="0" width="100" height="100" fill="url(#fadeGradient)" opacity="0.5"/>
    </g>
  </g>
</svg>