<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" overflow="visible">
  <defs>
    <style>
      .tsl-threat { color: #E74C3C; }
    </style>
  </defs>
  <g class="tsl-threat">
    
    <g opacity="0.2" stroke="currentColor" stroke-width="2"><circle cx="50" cy="50" r="30" fill="none" stroke-dasharray="4 4"/><line x1="50" y1="20" x2="50" y2="80"/><line x1="20" y1="50" x2="80" y2="50"/><line x1="28" y1="28" x2="72" y2="72"/><line x1="28" y1="72" x2="72" y2="28"/></g>
    
    <g stroke-dasharray="6 4">
      <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/>
    </g>
    
    
    <g class="tsl-modifier">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><line x1="85" y1="15" x2="110" y2="-10"/><line x1="15" y1="85" x2="-10" y2="110"/></g>
    </g>
  </g>
